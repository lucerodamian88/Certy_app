<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora de Días y Fojas</title>
  <link rel="icon" type="image/png" href="Certy_cara.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header class="site-header">
    <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Volver al menú principal"><i class="fa-solid fa-arrow-left"></i> Menú</button>
    <div class="logo-group">
      <img src="NeuquénCapital_logo.png" alt="Logo Neuquén Capital">
      <div class="dept-group">
        <span class="dept">Dirección Municipal de Certificaciones</span>
        <span class="subdept">Subsecretaría de Gestión de Contrataciones de Obras Públicas</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="weather-container">
        <div id="weather" class="weather"></div>
        <div class="city-label">Neuquén Capital</div>
      </div>
    </div>
  </header>

    <div class="form-wrapper">
      <div class="container form-container">
      <h1>Calculadora de Días y Fojas</h1>
      <div class="intro">
        <img src="Certy_trabajando.png" alt="Certy trabajando" class="calc-icon">
        <p class="description">Con la siguiente calculadora vamos a calcular la fecha de finalización de la obra y fojas a realizar.</p>
      </div>

    
    <label>Fecha de inicio de obra:
      <input type="date" id="startDate" placeholder="Ingrese fecha" />
    </label>

    <label>Plazo inicial (en días):
      <input type="number" id="initialDays" placeholder="Cantidad" />
    </label>

    <label>¿Hubo paralizaciones?
      <select id="hasPauses">
        <option value="no">No</option>
        <option value="yes">Sí</option>
      </select>
    </label>

    <div id="pauseSection"></div>

    <label>¿Hubo ampliación de plazo?
      <select id="hasExtension">
        <option value="no">No</option>
        <option value="yes">Sí</option>
      </select>
    </label>

    <div id="extensionSection"></div>

    <div class="button-row">
      <button id="calculateBtn" onclick="calculate()">🖩 Calcular</button>
      <button onclick="clearAll()">🗑 Borrar</button>
    </div>

    <div id="reporte"></div>
    <div id="printSection" style="display:none;">
      <button id="printBtn" onclick="openPdfReport()">🖨 Imprimir informe en PDF</button>
      <img src="Certy_saludando.png" alt="Certy" />
    </div>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="script.js"></script>
</body>
</html>
