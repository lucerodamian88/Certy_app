<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Días y Fojas</title>
  <link rel="icon" type="image/png" href="Certy_cara.png" />
  <link rel="stylesheet" href="styles_antigravity.css" />
  <link rel="stylesheet" href="styles_fixed.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    /* ESTILOS UNIFICADOS CERTY */
    .btn-certy {
      padding: 0.8rem 2rem !important;
      border-radius: 12px !important;
      border: none !important;
      background: #0C4FB7 !important;
      color: white !important;
      font-weight: 700 !important;
      font-size: 1rem !important;
      text-transform: uppercase !important;
      cursor: pointer !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1) !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 10px !important;
    }

    .btn-certy:hover {
      background: #08327d !important;
      box-shadow: 0 8px 25px rgba(12, 79, 183, 0.3) !important;
      transform: translateY(-2px) !important;
    }

    .btn-delete:hover {
      background: #f58b2a !important;
      box-shadow: 0 8px 25px rgba(245, 139, 42, 0.3) !important;
    }

    .btn-print {
      background: #2a7ff5 !important;
      margin: 2rem auto !important;
    }

    .certy-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      animation: fadeIn 0.3s ease;
    }

    .certy-modal {
      background: white;
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      max-width: 450px;
      width: 90%;
      text-align: center;
      animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .certy-modal img {
      height: 80px;
      margin-bottom: 1.5rem;
    }

    .certy-modal p {
      font-size: 1.1rem;
      color: #1a202c;
      margin-bottom: 2rem;
      line-height: 1.5;
      font-weight: 600;
    }

    .certy-modal-btn {
      padding: 0.8rem 2.5rem;
      background: #0C4FB7;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .certy-modal-btn:hover {
      background: #08327d;
    }

    .certy-img-small {
      width: 40% !important;
      height: auto !important;
      margin: 1rem auto !important;
      display: block !important;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scaleIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <!-- Abstract BG using the same class as index for consistency, but maybe fixed pos -->
  <div class="bg-wave">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path fill="#0C4FB7"
        d="M44.7,-76.4C58.9,-69.2,71.8,-59.1,79.6,-46.9C87.4,-34.7,90.1,-20.4,85.8,-7.4C81.5,5.6,70.2,17.2,59.6,27.1C49,37,39.1,45.2,28.7,51.4C18.3,57.6,7.4,61.8,-3.2,67.4C-13.8,72.9,-24.1,79.9,-34.3,77.5C-44.5,75.1,-54.6,63.3,-62.3,51.3C-70,39.3,-75.3,27.1,-76.8,14.5C-78.3,1.9,-76,-11.1,-69.8,-22.3C-63.6,-33.5,-53.5,-42.9,-42.6,-51.2C-31.7,-59.5,-20,-66.7,-7.4,-67.2C5.2,-67.7,29.3,-83.6,44.7,-76.4Z"
        transform="translate(100 100)" />
    </svg>
  </div>

  <header class="app-header">
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Volver"><i
          class="fa-solid fa-arrow-left"></i> Volver</button>
    </div>
    <div class="header-right">
      <div class="weather-widget">
        <i class="fa-solid fa-cloud-sun-rain"></i>
        <span>Neuquén</span>
      </div>
    </div>
  </header>

  <div class="form-wrapper">
    <div class="container form-container">
      <h1>Calculadora de Días y Fojas</h1>
      <div class="intro">
        <img src="Certy_trabajando.png" alt="Certy trabajando" class="calc-icon">
        <p class="description">Esta herramienta permite determinar la fecha de finalización de la obra y la cantidad de
          fojas correspondientes, considerando días efectivamente trabajados, paralizaciones y ampliaciones de plazo.
        </p>
      </div>


      <label>Fecha de inicio de obra:
        <input type="date" id="startDate" placeholder="Ingrese fecha" />
      </label>

      <label>Plazo inicial (en días):
        <input type="number" id="initialDays" placeholder="Cantidad" />
      </label>

      <label>¿Hubo paralizaciones?
        <select id="hasPauses">
          <option value="no">No</option>
          <option value="yes">Sí</option>
        </select>
      </label>

      <div id="pauseSection"></div>

      <label>¿Hubo ampliación de plazo?
        <select id="hasExtension">
          <option value="no">No</option>
          <option value="yes">Sí</option>
        </select>
      </label>

      <div id="extensionSection"></div>

      <div class="button-row">
        <button id="calculateBtn" class="btn-certy btn-calculate"><i class="fa-solid fa-calculator"></i>
          Calcular</button>
        <button id="clearBtn" class="btn-certy btn-delete"><i class="fa-solid fa-trash-can"></i> BORRAR</button>
      </div>

      <div id="reporte"></div>
      <div id="printSection" style="display:none;">
        <button id="printBtn" class="btn-certy btn-print"><i class="fa-solid fa-file-pdf"></i> Imprimir informe en
          PDF</button>
        <img src="Certy_saludando.png" alt="Certy" class="certy-img-small" />
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="script.js"></script>
</body>

</html>
