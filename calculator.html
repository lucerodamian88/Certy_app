<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Días y Fojas</title>
  <link rel="icon" type="image/png" href="Certy_cara.png" />
  <link rel="stylesheet" href="styles_antigravity.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/es.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <!-- Abstract BG using the same class as index for consistency, but maybe fixed pos -->
  <div class="bg-wave">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <path fill="#0C4FB7"
        d="M44.7,-76.4C58.9,-69.2,71.8,-59.1,79.6,-46.9C87.4,-34.7,90.1,-20.4,85.8,-7.4C81.5,5.6,70.2,17.2,59.6,27.1C49,37,39.1,45.2,28.7,51.4C18.3,57.6,7.4,61.8,-3.2,67.4C-13.8,72.9,-24.1,79.9,-34.3,77.5C-44.5,75.1,-54.6,63.3,-62.3,51.3C-70,39.3,-75.3,27.1,-76.8,14.5C-78.3,1.9,-76,-11.1,-69.8,-22.3C-63.6,-33.5,-53.5,-42.9,-42.6,-51.2C-31.7,-59.5,-20,-66.7,-7.4,-67.2C5.2,-67.7,29.3,-83.6,44.7,-76.4Z"
        transform="translate(100 100)" />
    </svg>
  </div>

  <header class="app-header">
    <div class="header-left">
      <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Volver"><i
          class="fa-solid fa-arrow-left"></i> Volver</button>
    </div>
    <div class="header-right">
      <div class="weather-widget">
        <i class="fa-solid fa-cloud-sun-rain"></i>
        <span>Neuquén</span>
      </div>
    </div>
  </header>

  <div class="form-wrapper">
    <div class="container form-container">
      <h1>Calculadora de Días y Fojas</h1>
      <div class="intro">
        <img src="Certy_trabajando.png" alt="Certy trabajando" class="calc-icon">
        <p class="description">Esta herramienta permite determinar la fecha de finalización de la obra y la cantidad de
          fojas correspondientes, considerando días efectivamente trabajados, paralizaciones y ampliaciones de plazo.
        </p>
      </div>


      <label>Fecha de inicio de obra:
        <input type="date" id="startDate" placeholder="Ingrese fecha" />
      </label>

      <label>Plazo inicial (en días):
        <input type="number" id="initialDays" placeholder="Cantidad" />
      </label>

      <label>¿Hubo paralizaciones?
        <select id="hasPauses">
          <option value="no">No</option>
          <option value="yes">Sí</option>
        </select>
      </label>

      <div id="pauseSection"></div>

      <label>¿Hubo ampliación de plazo?
        <select id="hasExtension">
          <option value="no">No</option>
          <option value="yes">Sí</option>
        </select>
      </label>

      <div id="extensionSection"></div>

      <div class="button-row">
        <button id="calculateBtn" class="btn-certy btn-calculate"><i class="fa-solid fa-calculator"></i>
          Calcular</button>
        <button id="clearBtn" class="btn-certy btn-delete"><i class="fa-solid fa-trash-can"></i> BORRAR</button>
      </div>

      <div id="reporte"></div>
      <div id="printSection" style="display:none;">
        <button id="printBtn" class="btn-certy btn-print"><i class="fa-solid fa-file-pdf"></i> Imprimir informe en
          PDF</button>
        <img src="Certy_saludando.png" alt="Certy" class="certy-img-small" />
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="script.js"></script>
</body>

</html>
