<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generación de Fojas</title>
    <link rel="icon" type="image/png" href="Certy_cara.png">
    <link rel="stylesheet" href="styles_antigravity_utf8.css">
    <link rel="stylesheet" href="styles_fixed.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* UI Base Elements */
        .drag-area {
            border: 2px dashed var(--color-primary);
            height: 250px;
            width: 100%;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(12, 79, 183, 0.03);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .drag-area.active {
            border: 2px solid var(--color-primary);
            background: rgba(12, 79, 183, 0.08);
        }

        .drag-area .icon { font-size: 4rem; color: var(--color-primary); margin-bottom: 1rem; }
        .drag-area header { font-size: 1.5rem; font-weight: 600; color: var(--color-text-dark); }
        .drag-area span { font-size: 1rem; color: var(--color-text-light); margin: 0.5rem 0 1rem 0; }
        
        .loader {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--color-primary);
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
            display: none; margin: 2rem auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .app-layout { display: flex; gap: 2rem; padding: 2rem; margin-top: 1rem; }
        
        .sidebar {
            width: 350px; flex-shrink: 0; background: #fff; border-radius: 16px; padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); display: none; height: fit-content;
        }
        .main-preview {
            flex-grow: 1; background: #f1f5f9; outline: 1px solid #cbd5e1;
            overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 2rem;
            display: none; flex-direction: column; align-items: center; gap: 2rem;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; color: #2d3748; }
        .form-group input { width: 100%; padding: 0.6rem; border: 1px solid #e2e8f0; border-radius: 8px; }
        .form-row { display: flex; gap: 1rem; }
        
        .toggle-container {
            display: flex; align-items: center; gap: 10px; margin-bottom: 1rem;
        }
        .toggle-container input[type="checkbox"] { width: 20px; height: 20px; }

        .btn-green { background: #28a745 !important; margin-top: 1rem; width: 100%; }
        .btn-green:hover { background: #218838 !important; }

        .edit-title { border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; margin-bottom: 1rem; color: #1a202c; }

        /* Printable Foja Container (Holds Pages) */
        .printable-area {
            width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px;
        }

        /* Single Page A4 Container */
        .foja-page {
            width: 210mm;
            min-height: 297mm;
            max-height: 297mm;
            height: 297mm;
            padding: 12mm 15mm 15mm 15mm;
            background: #fff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 8.5pt;
            color: #000;
            box-sizing: border-box;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .foja-page * { color: #000 !important; }
        
        .p-header h1 { font-size: 16pt; font-weight: bold; margin: 0 0 8pt 0; }
        .p-info-row { display: flex; justify-content: space-between; margin-bottom: 6pt; }
        .p-info-row span { font-weight: normal; }
        .p-info-bold { font-weight: bold !important; }
        
        .p-table { width: 100%; border-collapse: collapse; margin-bottom: 5pt; border: 1px solid #000; border-radius: 0 !important; }
        .p-table th, .p-table td { border: 1px solid #000; padding: 3pt 4pt; text-align: center; border-radius: 0 !important; font-size: 8.5pt; }
        .p-table th { background: #fff; font-weight: bold; }
        
        .t-left { text-align: left !important; }
        .t-right { text-align: right !important; }
        .t-center { text-align: center !important; }
        
        .border-none { border: none !important; }

        /* Print Override */
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body * { visibility: hidden; }
            .printable-area, .printable-area * { visibility: visible; }
            .printable-area {
                position: absolute; left: 0; top: 0; width: 100%;
                margin: 0; padding: 0; background: #fff; box-shadow: none;
            }
            .foja-page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
                min-height: 297mm;
                max-height: 297mm;
                height: 297mm;
                box-sizing: border-box;
            }
            .sidebar, .app-header, .drag-area, .bg-wave, #uploadSection { display: none !important; }
        }

    </style>
</head>

<body>
    <div class="bg-wave">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path fill="#0C4FB7" d="M44.7,-76.4C58.9,-69.2,71.8,-59.1,79.6,-46.9C87.4,-34.7,90.1,-20.4,85.8,-7.4C81.5,5.6,70.2,17.2,59.6,27.1C49,37,39.1,45.2,28.7,51.4C18.3,57.6,7.4,61.8,-3.2,67.4C-13.8,72.9,-24.1,79.9,-34.3,77.5C-44.5,75.1,-54.6,63.3,-62.3,51.3C-70,39.3,-75.3,27.1,-76.8,14.5C-78.3,1.9,-76,-11.1,-69.8,-22.3C-63.6,-33.5,-53.5,-42.9,-42.6,-51.2C-31.7,-59.5,-20,-66.7,-7.4,-67.2C5.2,-67.7,29.3,-83.6,44.7,-76.4Z" transform="translate(100 100)" />
        </svg>
    </div>

    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>
        <div class="header-right">
            <div class="weather-widget"><span>Generación de Fojas</span></div>
        </div>
    </header>

    <div style="max-width: 1600px; margin: 0 auto; padding: 1rem 2rem;">
        
        <div id="uploadSection" style="max-width: 900px; margin: 2rem auto; text-align: center;">
            <h1 style="color: #0C4FB7; margin-bottom: 1rem;">Generador de Foja Institucional</h1>
            <p style="color: #4a5568; margin-bottom: 2rem;">Copia todo el texto de tu PDF de la foja y pégalo abajo. Nuestro sistema estructurará el contenido automáticamente dividiéndolo en páginas si corresponde.</p>
            
            <textarea id="rawTextInput" style="width: 100%; height: 250px; padding: 1rem; border-radius: 12px; border: 2px solid #cbd5e1; font-family: monospace; font-size: 0.95rem; resize: vertical;" placeholder="Pegue aquí el texto copiado del PDF de la Foja..."></textarea>
            
            <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: center;">
                <button id="processBtn" class="btn-certy"><i class="fa-solid fa-wand-magic-sparkles"></i> Procesar y Previsualizar</button>
                <button id="clearBtn" class="btn-certy" style="background: #e2e8f0; color: #475569;"><i class="fa-solid fa-trash-can"></i> Limpiar Datos</button>
            </div>
            
            <div id="errorMsg" style="color: red; margin-top: 1rem; font-weight: bold;"></div>
        </div>

        <div class="app-layout">
            <!-- Sidebar Editor -->
            <div class="sidebar" id="sidebar">
                <h3 class="edit-title"><i class="fa-solid fa-pen-to-square"></i> Edición de Foja</h3>
                
                <div class="form-group">
                    <label>Título de Foja</label>
                    <input type="text" id="fojaMedicionInput" placeholder="ej: Foja de Medición Adicional N 1 FINAL">
                </div>

                <div class="form-group">
                    <label>Alteración Contractual</label>
                    <input type="text" id="alteracionInput" placeholder="ej: ALTERACIÓN CONTRACTUAL en Trámite Expte N° OE -8727-M-2024 Alc:2/2025">
                </div>

                <div class="form-group">
                    <label>Monto con Ampliación/Disminución</label>
                    <input type="text" id="montoAmpliacionInput" placeholder="ej: 582.913.543,69">
                </div>

                <hr style="margin: 1rem 0; border: 0; border-top: 1px solid #e2e8f0;">

                <div class="toggle-container">
                    <input type="checkbox" id="showVariacionDec" checked>
                    <label for="showVariacionDec" style="font-weight: bold; cursor: pointer;">Mostrar Variación de decimales</label>
                </div>
                
                <div class="form-group" id="variacionGroup">
                    <label>Valor de Variación de decimales</label>
                    <div class="form-row">
                        <input type="text" id="varDecItem" placeholder="% Avance Item (ej: 0.0001)">
                        <input type="text" id="varDecObra" placeholder="% Avance Obra (ej: 0.0001)">
                    </div>
                </div>

                <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #e2e8f0;">
                
                <h4 style="margin-bottom: 1rem; color: #2b6cb0;">Cuadro de Avances</h4>
                <div class="form-group">
                    <label>Avance de Obra Mensual</label>
                    <input type="text" id="avanceMensual" placeholder="ej: 8,8808%">
                </div>
                <div class="form-group">
                    <label>Avance Acum. Anterior</label>
                    <input type="text" id="avanceAnterior" placeholder="ej: 91,1192%">
                </div>
                <div class="form-group">
                    <label>Avance Acumulado</label>
                    <input type="text" id="avanceAcumulado" placeholder="ej: 100,0000%">
                </div>

                <button class="btn-certy btn-green" id="downloadPdfBtn" onclick="downloadPDF()"><i class="fa-solid fa-file-pdf"></i> GENERAR</button>
                
                <div id="sumWarning" style="display: none; align-items: flex-start; margin-top: 15px; background: #fff5f5; border: 1px solid #feb2b2; padding: 10px; border-radius: 8px;">
                    <img src="Certy_advertencia.png" alt="Certy Advertencia" style="width: 40px; margin-right: 10px;">
                    <div style="font-size: 0.85rem; color: #c53030; text-align: left;">
                        <strong>¡Diferencia en sumatorias!</strong><br>
                        <span id="sumWarningText"></span>
                    </div>
                </div>
            </div>

            <!-- Previsualizacion Documento (Contenedor de Páginas) -->
            <div class="main-preview" id="mainPreview">
                <div class="printable-area" id="printableFoja">
                    <!-- Páginas inyectadas vía JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentState = null;

        const rawTextInput = document.getElementById("rawTextInput");
        const processBtn = document.getElementById("processBtn");
        const clearBtn = document.getElementById("clearBtn");
        const errorMsg = document.getElementById("errorMsg");
        const uploadSection = document.getElementById("uploadSection");
        const sidebar = document.getElementById("sidebar");
        const mainPreview = document.getElementById("mainPreview");

        // Reactivity Controls
        const fojaMedicionInput = document.getElementById("fojaMedicionInput");
        const alteracionInput = document.getElementById("alteracionInput");
        const montoAmpliacionInput = document.getElementById("montoAmpliacionInput");
        const showVariacionDec = document.getElementById("showVariacionDec");
        const variacionGroup = document.getElementById("variacionGroup");
        const varDecItem = document.getElementById("varDecItem");
        const varDecObra = document.getElementById("varDecObra");
        const avanceMensual = document.getElementById("avanceMensual");
        const avanceAnterior = document.getElementById("avanceAnterior");
        const avanceAcumulado = document.getElementById("avanceAcumulado");

        clearBtn.addEventListener("click", () => {
            rawTextInput.value = "";
            errorMsg.innerText = "";
        });

        processBtn.addEventListener("click", () => {
            const text = rawTextInput.value.trim();
            if(!text) {
                errorMsg.innerText = "Por favor, pega el texto del PDF primero.";
                return;
            }
            errorMsg.innerText = "";
            processText(text);
        });

        function parseText(text) {
            const state = {
                encabezado: {},
                items: [],
                variacion_decimales: { existe: false },
                avances: {}
            };

            // 1. Encabezado
            const extract = (regex) => { const m = text.match(regex); return m ? m[1].trim() : ""; };
            
            state.encabezado.obra = extract(/OBRA:\s*([^\n\r]+)/i);
            
            const idObraMatch = text.match(/Identif\.?\s*Obra\s*:?\s*([A-Za-z0-9\-]+)/i);
            state.encabezado.identif_obra = idObraMatch ? idObraMatch[1].trim() : "";

            const expMatch = text.match(/N°\s*Exp:?\s*([A-Za-z0-9\-\s\/]+?)(?=\s*FOJA|\s*ALTERACI|\s*UNIDAD|[\r\n]|$)/i);
            state.encabezado.n_exp = expMatch ? expMatch[1].trim() : "";
            
            const dateMatches = text.match(/\d{2}\/\d{2}\/\d{2,4}/g);
            if(dateMatches && dateMatches.length >= 1) state.encabezado.fecha_inicio = dateMatches[0];
            if(dateMatches && dateMatches.length >= 2) state.encabezado.fecha_medicion = dateMatches[1];
            if(dateMatches && dateMatches.length >= 3) state.encabezado.fecha_terminacion = dateMatches[2];
            
            const fojaMatch = text.match(/(Foja\s+de\s+Medici[oó]n[^\n\r]*)/i);
            if(fojaMatch) {
                let titleStr = fojaMatch[1].trim();
                if(text.includes("MODELO") && !titleStr.includes("MODELO")) {
                    titleStr += "\nMODELO";
                }
                state.encabezado.foja_medicion = titleStr;
            }

            state.encabezado.contratista = extract(/CONTRATISTA:\s*([^\n\r]+)/i);
            
            const montoMatch = text.match(/Monto Contrato:\s*\$?\s*([\d\.,]+)/i);
            state.encabezado.monto_contrato = montoMatch ? montoMatch[1].trim() : "";

            const ampliacionMatch = text.match(/Monto con Ampliaci[oó]n\/Disminuci[oó]n\s*\$?\s*([\d\.,]+)/i);
            state.encabezado.monto_ampliacion = ampliacionMatch ? ampliacionMatch[1].trim() : "";

            state.encabezado.inspectores = extract(/Inspectores:\s*([^\n\r]+)/i);

            const alteracionMatch = text.match(/(ALTERACI[ÓO]N\s*CONTRACTUAL[^\n\r]*)/i);
            state.encabezado.alteracion = alteracionMatch ? alteracionMatch[1].trim() : "";

            // 2. Items - Filtrar ruido de saltos de página del PDF copiado
            const rawLines = text.split('\n').map(l => l.trim()).filter(l => l);
            const lines = rawLines.filter(line => {
                if (/^P[áa]gina\s+\d+/i.test(line)) return false;
                if (/^P[áa]gina$/i.test(line)) return false;
                if (line.toLowerCase() === 'de') return false;
                if (/^FOJA\s+DE\s+MEDICION/i.test(line)) return false;
                if (/^FECHAS$/i.test(line)) return false;
                if (/^UNIDAD\s+DE\s+MEDIDA$/i.test(line)) return false;
                if (/^Descripción\s+Contrato/i.test(line)) return false;
                if (/^Cantidad\s+CANTIDAD/i.test(line)) return false;
                if (/^Precio$/i.test(line)) return false;
                if (/^Obra$/i.test(line)) return false;
                if (/^Item\s+Un\.$/i.test(line)) return false;
                if (/^CANTIDAD\s+Ant\./i.test(line)) return false;
                if (/^%\s*Avance\s+%\s*Avance/i.test(line)) return false;
                return true;
            });

            for(let i=0; i<lines.length; i++) {
                let line = lines[i];
                
                // Detectar ítem numerado
                const itemMatch = line.match(/^(\d+(?:\.\d+)*)\s+(.+?)\s+([A-Za-z\d²³]+|\-)?\s+([\d\.,]+)\s+([\d\.,]+)(?:\s+([\d\.,]+))?(?:\s+([\d\.,]+))?(?:\s+([\d\.,]+))?(?:\s+([\d\.,]+%?))?(?:\s+([\d\.,]+%?))?$/);
                
                if (itemMatch) {
                    state.items.push({
                        item: itemMatch[1],
                        descripcion: itemMatch[2],
                        un: itemMatch[3] || '',
                        cantidad_contrato: itemMatch[4] || '',
                        precio: itemMatch[5] || '',
                        cantidad_ant: itemMatch[6] || '',
                        cantidad_actual: itemMatch[7] || '',
                        cantidad_acum: itemMatch[8] || '',
                        avance_item: itemMatch[9] || '',
                        avance_obra: itemMatch[10] || ''
                    });
                } else {
                    // Título de sección (ej. "1 TAREAS PRELIMINARES")
                    const sectionMatch = line.match(/^(\d+(?:\.\d+)*)\s+([A-Za-z].+)$/);
                    if(sectionMatch && !line.includes("Avance") && !line.includes("Variación")) {
                        const hasNumbers = /\d/.test(sectionMatch[2].substring(Math.max(0, sectionMatch[2].length - 5)));
                        if(!hasNumbers) {
                            state.items.push({
                                item: sectionMatch[1],
                                descripcion: sectionMatch[2],
                                un: '', cantidad_contrato: '', precio: '', cantidad_ant: '', cantidad_actual: '', cantidad_acum: '', avance_item: '', avance_obra: ''
                            });
                            continue;
                        }
                    }
                    
                    // Continuación de descripción de ítem anterior
                    if(state.items.length > 0) {
                        const excludeRegex = /avance|variaci[oó]n|municipalidad|obra:|identif\.|fecha|foja|contratista|inspector|monto|^[\d\.,%\s]+$|canti|precio|item|descripc/i;
                        if(!excludeRegex.test(line)) {
                            state.items[state.items.length - 1].descripcion += " " + line;
                        }
                    }
                }
            }

            // 3. Totales y Avances
            state.avances.mensual = extract(/Avance de Obra Mensual\s+([\d\.,]+%?)/i);
            state.avances.acum_anterior = extract(/Avance Acum\.?\s*Anterior\s+([\d\.,]+%?)/i);
            state.avances.acumulado = extract(/Avance Acumulado\s+([\d\.,]+%?)/i);

            const varDecMatch = text.match(/Variaci[oó]n de decimales.*?\s+([\d\.,\-]+)(?:\s+([\d\.,\-]+))?/im);
            if(varDecMatch) {
                state.variacion_decimales.existe = true;
                if(varDecMatch[2]) {
                    state.variacion_decimales.avance_item = varDecMatch[1];
                    state.variacion_decimales.avance_obra = varDecMatch[2];
                } else {
                    state.variacion_decimales.avance_item = varDecMatch[1];
                    state.variacion_decimales.avance_obra = "";
                }
            }

            return state;
        }

        function processText(text) {
            try {
                currentState = parseText(text);
                populateFormAndRender();
                
                uploadSection.style.display = "none";
                sidebar.style.display = "block";
                mainPreview.style.display = "flex";
            } catch (err) {
                errorMsg.innerText = "Ocurrió un error procesando el texto: " + err.message;
            }
        }

        function str(val) { return val || ''; }

        function populateFormAndRender() {
            if(!currentState) return;
            
            // Populating Editor Form Header Fields
            if(currentState.encabezado) {
                if(fojaMedicionInput) fojaMedicionInput.value = str(currentState.encabezado.foja_medicion);
                if(alteracionInput) alteracionInput.value = str(currentState.encabezado.alteracion);
                if(montoAmpliacionInput) montoAmpliacionInput.value = str(currentState.encabezado.monto_ampliacion);
            }

            // Populating Editor Form Decimal Variation
            if(currentState.variacion_decimales) {
                showVariacionDec.checked = currentState.variacion_decimales.existe;
                varDecItem.value = str(currentState.variacion_decimales.avance_item);
                varDecObra.value = str(currentState.variacion_decimales.avance_obra);
            }
            if(currentState.avances) {
                let initialSumItem = 0;
                let initialSumObra = 0;
                currentState.items.forEach(itm => {
                    let valI = parseFloat(str(itm.avance_item).replace(',', '.'));
                    let valO = parseFloat(str(itm.avance_obra).replace(',', '.'));
                    if(!isNaN(valI)) initialSumItem += valI;
                    if(!isNaN(valO)) initialSumObra += valO;
                });
                if(currentState.variacion_decimales && currentState.variacion_decimales.existe) {
                    let varI = parseFloat(str(currentState.variacion_decimales.avance_item).replace(',', '.'));
                    let varO = parseFloat(str(currentState.variacion_decimales.avance_obra).replace(',', '.'));
                    if(!isNaN(varI)) initialSumItem += varI;
                    if(!isNaN(varO)) initialSumObra += varO;
                }

                avanceMensual.value = initialSumItem.toFixed(4).replace('.', ',');
                avanceAnterior.value = str(currentState.avances.acum_anterior);
                avanceAcumulado.value = initialSumObra.toFixed(4).replace('.', ',');
            }

            renderDocument();
        }

        function chunkItemsIntoPages(items, showVariacion) {
            if (!items || items.length === 0) return [[]];

            const pages = [];
            let currentPage = [];
            let currentWeight = 0;
            
            // Capacidades alineadas exactamente al estándar institucional
            const MAX_PAGE_1_WEIGHT = 30;
            const MAX_MIDDLE_PAGE_WEIGHT = 36;
            const MAX_LAST_PAGE_WEIGHT = 30;

            for (let i = 0; i < items.length; i++) {
                const itm = items[i];
                const descLen = itm.descripcion ? itm.descripcion.length : 0;
                let weight = 1;
                if (descLen > 65) weight = 1.5;
                if (descLen > 130) weight = 2;

                let maxWeight = (pages.length === 0) ? MAX_PAGE_1_WEIGHT : MAX_MIDDLE_PAGE_WEIGHT;

                if (currentWeight + weight > maxWeight && currentPage.length > 0) {
                    pages.push(currentPage);
                    currentPage = [];
                    currentWeight = 0;
                }

                currentPage.push(itm);
                currentWeight += weight;
            }

            if (currentPage.length > 0) {
                pages.push(currentPage);
            }

            // Asegurar que la última página tenga espacio para el Cuadro de Avances
            if (pages.length > 0) {
                let lastPage = pages[pages.length - 1];
                let lastWeight = 0;
                lastPage.forEach(itm => {
                    const descLen = itm.descripcion ? itm.descripcion.length : 0;
                    let w = 1;
                    if (descLen > 65) w = 1.5;
                    if (descLen > 130) w = 2;
                    lastWeight += w;
                });

                if (lastWeight > MAX_LAST_PAGE_WEIGHT && lastPage.length > 5) {
                    let splitIndex = Math.floor(lastPage.length * 0.7);
                    let pageA = lastPage.slice(0, splitIndex);
                    let pageB = lastPage.slice(splitIndex);
                    pages[pages.length - 1] = pageA;
                    pages.push(pageB);
                }
            }

            return pages;
        }

        function syncTableToState() {
            if(!currentState || !currentState.items) return;
            const rows = document.querySelectorAll('#printableFoja .items-table tbody tr');
            let itemIdx = 0;
            rows.forEach((tr) => {
                if(tr.children.length >= 10 && !tr.textContent.includes("Variación de decimales")) {
                    if(currentState.items[itemIdx]) {
                        currentState.items[itemIdx].item = tr.children[0].textContent;
                        currentState.items[itemIdx].descripcion = tr.children[1].textContent;
                        currentState.items[itemIdx].un = tr.children[2].textContent;
                        currentState.items[itemIdx].cantidad_contrato = tr.children[3].textContent;
                        currentState.items[itemIdx].precio = tr.children[4].textContent;
                        currentState.items[itemIdx].cantidad_ant = tr.children[5].textContent;
                        currentState.items[itemIdx].cantidad_actual = tr.children[6].textContent;
                        currentState.items[itemIdx].cantidad_acum = tr.children[7].textContent;
                        currentState.items[itemIdx].avance_item = tr.children[8].textContent;
                        currentState.items[itemIdx].avance_obra = tr.children[9].textContent;
                        itemIdx++;
                    }
                }
            });
        }

        function renderDocument() {
            if(!currentState) return;
            
            // Guardar ediciones manuales si existen
            syncTableToState();

            const container = document.getElementById('printableFoja');
            container.innerHTML = '';

            const head = currentState.encabezado || {};
            const fojaVal = (fojaMedicionInput && fojaMedicionInput.value) ? fojaMedicionInput.value : str(head.foja_medicion);
            const alteracionVal = (alteracionInput && alteracionInput.value) ? alteracionInput.value : str(head.alteracion);
            const montoAmplVal = (montoAmpliacionInput && montoAmpliacionInput.value) ? montoAmpliacionInput.value : str(head.monto_ampliacion);

            const items = currentState.items || [];
            const pagesItems = chunkItemsIntoPages(items, showVariacionDec.checked);
            const totalPages = pagesItems.length;

            pagesItems.forEach((pageItems, pageIdx) => {
                const pageNum = pageIdx + 1;
                const isFirstPage = (pageNum === 1);
                const isLastPage = (pageNum === totalPages);

                const pageDiv = document.createElement('div');
                pageDiv.className = 'foja-page';
                pageDiv.setAttribute('contenteditable', 'true');

                let html = '';

                // ENCABEZADO DE PÁGINA 1
                if (isFirstPage) {
                    html += `
                        <div class="p-header">
                            <h1 style="font-weight: bold; margin-bottom: 12pt; font-size: 16pt;">Municipalidad de Neuquén</h1>
                            <div style="text-transform: uppercase; margin-bottom: 6pt; text-align: left; font-size: 8.5pt;">OBRA: <span style="margin-left:5px;">${str(head.obra)}</span></div>
                            
                            <div style="margin-top: 8pt; text-align: left; font-size: 8.5pt;">
                                <span>Identif. Obra &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>${str(head.identif_obra)}</span></span>
                                <span style="margin-left: 10pt;">N° Exp: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <span>${str(head.n_exp)}</span></span>
                                <span style="margin-left: 10pt; text-transform: uppercase;">FOJA DE MEDICION POR &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; UNIDAD DE MEDIDA</span>
                            </div>
                        </div>

                        <!-- Tabla Fechas y Numero de Foja -->
                        <table class="p-table" style="margin-bottom: 3pt; margin-top: 5pt; table-layout: fixed;">
                            <tr>
                                <td class="t-center" style="font-weight: normal; padding: 2pt;">FECHAS</td>
                                <td rowspan="2" class="t-center" style="width: 220pt; font-size: 10.5pt; font-weight: bold;">${fojaVal.replace(/\n/g, '<br>')}</td>
                            </tr>
                            <tr>
                                <td class="t-left" style="padding-left: 4pt;">
                                    De Inicio: <span style="margin-left:5pt; margin-right:15pt;">${str(head.fecha_inicio)}</span>
                                    De Medición: <span style="margin-left:5pt; margin-right:15pt;">${str(head.fecha_medicion)}</span>
                                    Fecha de Terminación: <span style="margin-left:5pt;">${str(head.fecha_terminacion)}</span>
                                </td>
                            </tr>
                        </table>

                        <!-- Datos Generales -->
                        <div style="display: flex; justify-content: space-between; margin-bottom: 2pt; font-size: 8.5pt;">
                            <div style="text-transform: uppercase; padding-left: 4pt;">CONTRATISTA: <span style="margin-left: 5px;">${str(head.contratista)}</span></div>
                            <div style="padding-right: 4pt;">Monto Contrato: $ <span style="margin-left: 5px; min-width: 80pt; display: inline-block; text-align: right;">${str(head.monto_contrato)}</span></div>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 2pt; font-size: 8.5pt;">
                            <div style="padding-left: 4pt;">Inspectores: <span style="margin-left: 5px;">${str(head.inspectores)}</span></div>
                            <div style="padding-right: 4pt; ${montoAmplVal ? '' : 'visibility:hidden;'}">Monto con Ampliación/Disminución $ <span style="margin-left: 5px; min-width: 80pt; display: inline-block; text-align: right;">${str(montoAmplVal)}</span></div>
                        </div>
                        ${alteracionVal ? `
                        <div style="display: flex; justify-content: space-between; margin-bottom: 4pt; font-size: 8.5pt;">
                            <div style="padding-left: 4pt;"><span style="font-weight: normal;">${alteracionVal}</span></div>
                        </div>` : ''}
                    `;
                }

                // CABECERA DE TABLA (En todas las páginas)
                html += `
                    <table class="p-table items-table" style="margin-top: ${isFirstPage ? '2pt' : '0'};">
                        <thead>
                            <tr>
                                <th rowspan="2" style="width: 28pt;">Ítem</th>
                                <th rowspan="2" style="width: 320pt;">Descripción</th>
                                <th rowspan="2" style="width: 25pt;">Un.</th>
                                <th rowspan="2" style="width: 65pt;">Cantidad<br>Contrato</th>
                                <th rowspan="2" style="width: 85pt;">Precio</th>
                                <th colspan="3">CANTIDAD</th>
                                <th rowspan="2" style="width: 55pt;">% Avance<br>Item</th>
                                <th rowspan="2" style="width: 55pt;">% Avance<br>Obra</th>
                            </tr>
                            <tr>
                                <th style="width: 50pt;">Ant.</th>
                                <th style="width: 50pt;">Actual</th>
                                <th style="width: 50pt;">Acum.</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                // FILAS DE ÍTEMS DE ESTA PÁGINA
                pageItems.forEach(itm => {
                    let isSection = !itm.item && !itm.un && !itm.precio && itm.descripcion;
                    html += `
                        <tr>
                            <td class="t-left">${str(itm.item)}</td>
                            <td class="t-left" style="${isSection ? 'text-transform:uppercase; font-weight:bold;' : ''}">${str(itm.descripcion)}</td>
                            <td class="t-center">${str(itm.un)}</td>
                            <td class="t-right">${str(itm.cantidad_contrato)}</td>
                            <td class="t-right">${str(itm.precio)}</td>
                            <td class="t-right">${str(itm.cantidad_ant)}</td>
                            <td class="t-right">${str(itm.cantidad_actual)}</td>
                            <td class="t-right">${str(itm.cantidad_acum)}</td>
                            <td class="t-right">${str(itm.avance_item)}</td>
                            <td class="t-right">${str(itm.avance_obra)}</td>
                        </tr>
                    `;
                });

                // VARIACIÓN DE DECIMALES (Última página si está activo)
                if (isLastPage && showVariacionDec.checked) {
                    html += `
                        <tr>
                            <td class="t-left"></td>
                            <td class="t-left" style="font-weight: normal;">Variación de decimales</td>
                            <td class="t-center"></td>
                            <td class="t-right"></td>
                            <td class="t-right"></td>
                            <td class="t-right"></td>
                            <td class="t-right"></td>
                            <td class="t-right"></td>
                            <td class="t-center">${varDecItem.value}</td>
                            <td class="t-center">${varDecObra.value}</td>
                        </tr>
                    `;
                }

                html += `
                        </tbody>
                    </table>
                `;

                // CUADRO DE AVANCES (Última página, alineado estrictamente a la derecha)
                if (isLastPage) {
                    const formatPct = (val) => val && !val.trim().endsWith('%') ? val.trim() + '%' : val;
                    html += `
                        <div style="width: 100%; display: flex; justify-content: flex-end; margin-top: 6pt;">
                            <table class="p-table" style="width: 310pt; margin: 0; border-collapse: collapse;">
                                <tr>
                                    <td class="t-left" style="font-weight: normal; width: 180pt;">Avance de Obra Mensual</td>
                                    <td class="t-right" style="font-weight: normal; width: 130pt;" id="r_av_men">${formatPct(avanceMensual.value)}</td>
                                </tr>
                                <tr>
                                    <td class="t-left" style="font-weight: normal;">Avance Acum. Anterior</td>
                                    <td class="t-right" style="font-weight: normal;" id="r_av_ant">${formatPct(avanceAnterior.value)}</td>
                                </tr>
                                <tr>
                                    <td class="t-left" style="font-weight: normal;">Avance Acumulado</td>
                                    <td class="t-right" style="font-weight: normal;" id="r_av_acu">${formatPct(avanceAcumulado.value)}</td>
                                </tr>
                            </table>
                        </div>
                    `;
                }

                // PIE DE PÁGINA ("Página X de Y")
                html += `
                    <div style="text-align: right; font-size: 8.5pt; margin-top: auto; padding-top: 5pt; font-weight: normal;">
                        Página ${pageNum} de ${totalPages}
                    </div>
                `;

                pageDiv.innerHTML = html;
                container.appendChild(pageDiv);
            });

            if (showVariacionDec.checked) {
                variacionGroup.style.display = 'block';
            } else {
                variacionGroup.style.display = 'none';
            }

            validateSums();
        }

        function calculateSums() {
            let sumItem = 0;
            let sumObra = 0;
            if (currentState && currentState.items) {
                currentState.items.forEach(itm => {
                    let valI = parseFloat(str(itm.avance_item).replace(',', '.'));
                    let valO = parseFloat(str(itm.avance_obra).replace(',', '.'));
                    if(!isNaN(valI)) sumItem += valI;
                    if(!isNaN(valO)) sumObra += valO;
                });
            }

            if(showVariacionDec.checked) {
                let varI = parseFloat(varDecItem.value.replace(',', '.'));
                let varO = parseFloat(varDecObra.value.replace(',', '.'));
                if(!isNaN(varI)) sumItem += varI;
                if(!isNaN(varO)) sumObra += varO;
            }
            
            return { sumItem, sumObra };
        }

        function validateSums() {
            const sums = calculateSums();
            let userMensual = parseFloat(avanceMensual.value.replace(',', '.'));
            let userAnterior = parseFloat(avanceAnterior.value.replace(',', '.'));
            let userAcumulado = parseFloat(avanceAcumulado.value.replace(',', '.'));
            
            let advertencias = [];
            
            // 1. Control Sumatoria de Columnas
            if(isNaN(userMensual) || Math.abs(userMensual - sums.sumItem) > 0.001) {
                advertencias.push(`Avance Mensual: Sumatoria real de columna es <b>${sums.sumItem.toFixed(4)}%</b> pero recuadro dice <b>${isNaN(userMensual) ? 'vacío' : userMensual.toFixed(4) + '%'}</b>.`);
            }
            if(isNaN(userAcumulado) || Math.abs(userAcumulado - sums.sumObra) > 0.001) {
                advertencias.push(`Avance Acumulado: Sumatoria real de columna es <b>${sums.sumObra.toFixed(4)}%</b> pero recuadro dice <b>${isNaN(userAcumulado) ? 'vacío' : userAcumulado.toFixed(4) + '%'}</b>.`);
            }
            
            // 2. Control Lógico del Cuadro (Mensual + Anterior = Acumulado)
            if(!isNaN(userMensual) && !isNaN(userAnterior) && !isNaN(userAcumulado)) {
                let sumaCuadro = userMensual + userAnterior;
                if(Math.abs(sumaCuadro - userAcumulado) > 0.001) {
                    advertencias.push(`Matemática del Cuadro: Mensual (<b>${userMensual.toFixed(4)}%</b>) + Anterior (<b>${userAnterior.toFixed(4)}%</b>) da <b>${sumaCuadro.toFixed(4)}%</b>, pero pusiste que el Acumulado es <b>${userAcumulado.toFixed(4)}%</b>.`);
                }
            }

            const warningDiv = document.getElementById('sumWarning');
            warningDiv.style.display = 'flex';
            
            if(advertencias.length > 0) {
                warningDiv.style.background = '#fff5f5';
                warningDiv.style.border = '1px solid #feb2b2';
                warningDiv.innerHTML = `
                    <img src="Certy_advertencia.png" alt="Certy Advertencia" style="width: 70px; margin-right: 15px; flex-shrink: 0;">
                    <div style="font-size: 0.9rem; color: #c53030; text-align: left; display: flex; flex-direction: column; justify-content: center;">
                        <strong style="font-size: 1.05rem; margin-bottom: 5px;">¡Diferencia en sumatorias!</strong>
                        <span>${advertencias.join('<br>')}</span>
                    </div>
                `;
            } else {
                warningDiv.style.background = '#f0fdf4';
                warningDiv.style.border = '1px solid #86efac';
                warningDiv.innerHTML = `
                    <div style="width: 70px; margin-right: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <i class="fa-solid fa-check-circle" style="font-size: 40px; color: #22c55e;"></i>
                    </div>
                    <div style="font-size: 0.9rem; color: #166534; text-align: left; display: flex; flex-direction: column; justify-content: center;">
                        <strong style="font-size: 1.05rem; margin-bottom: 5px;">Control Cruzado: APROBADO</strong>
                        <span>Las sumatorias coinciden perfectamente con los recuadros.</span>
                    </div>
                `;
            }
        }

        // Live Auto-Update from Table / Variacion
        function updateBoxesFromTable() {
            syncTableToState();
            const sums = calculateSums();
            avanceMensual.value = sums.sumItem.toFixed(4).replace('.', ',');
            avanceAcumulado.value = sums.sumObra.toFixed(4).replace('.', ',');
            
            const formatPct = (val) => val && !val.trim().endsWith('%') ? val.trim() + '%' : val;
            const rAvMen = document.getElementById('r_av_men');
            const rAvAcu = document.getElementById('r_av_acu');
            if (rAvMen) rAvMen.textContent = formatPct(avanceMensual.value);
            if (rAvAcu) rAvAcu.textContent = formatPct(avanceAcumulado.value);
            
            validateSums();
        }

        // Live Bindings
        fojaMedicionInput.addEventListener('input', renderDocument);
        alteracionInput.addEventListener('input', renderDocument);
        montoAmpliacionInput.addEventListener('input', renderDocument);

        showVariacionDec.addEventListener('change', () => { renderDocument(); updateBoxesFromTable(); });
        varDecItem.addEventListener('input', () => { renderDocument(); updateBoxesFromTable(); });
        varDecObra.addEventListener('input', () => { renderDocument(); updateBoxesFromTable(); });
        
        avanceMensual.addEventListener('input', renderDocument);
        avanceAnterior.addEventListener('input', renderDocument);
        avanceAcumulado.addEventListener('input', renderDocument);
        
        document.getElementById('printableFoja').addEventListener('input', updateBoxesFromTable);

        async function downloadPDF() {
            const btn = document.getElementById('downloadPdfBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERANDO...';
            btn.disabled = true;

            try {
                const pages = document.querySelectorAll('.foja-page');
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');

                for (let i = 0; i < pages.length; i++) {
                    const pageEl = pages[i];
                    const canvas = await html2canvas(pageEl, { scale: 2, useCORS: true, logging: false });
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();

                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                }

                pdf.save('Foja_de_Medicion.pdf');
            } catch (err) {
                console.error("Error generando PDF: ", err);
                alert("Ocurrió un error al generar el PDF.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
