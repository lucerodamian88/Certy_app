<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Redeterminación</title>
  <link rel="icon" type="image/png" href="Certy_cara.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .iframe-wrapper {
      display: flex;
      justify-content: center;
      align-items: stretch;
      padding: 1rem;
      height: calc(100vh - 140px);
      max-width: 1280px;
      margin: 0 auto;
    }

    .iframe-wrapper iframe {
      flex: 1;
      border: none;
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.18);
      background: #fff;
    }

    @media (max-width: 768px) {
      .iframe-wrapper {
        height: calc(100vh - 120px);
        padding: 0.5rem;
      }

      .iframe-wrapper iframe {
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Volver al menú principal"><i class="fa-solid fa-arrow-left"></i> Menú</button>
    <div class="logo-group">
      <img src="NeuquénCapital_logo.png" alt="Logo Neuquén Capital">
      <div class="dept-group">
        <span class="dept">Dirección Municipal de Certificaciones</span>
        <span class="subdept">Subsecretaría de Gestión de Contrataciones de Obras Públicas</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="weather-container">
        <div id="weather" class="weather"></div>
        <div class="city-label">Neuquén Capital</div>
      </div>
    </div>
  </header>

  <main class="form-wrapper">
    <div class="container form-container">
      <div class="asistente-header">
        <h1>Asistente de Redeterminación de Precios</h1>
        <p class="asistente-subtitle">Esta vista integra la nueva implementación proporcionada por el equipo de Certificaciones.</p>
      </div>
    </div>

    <div class="iframe-wrapper">
      <iframe src="https://script.google.com/macros/s/AKfycbwsl4Ows3f_Dj0SmbRw7I72aVZIrWsnMUFEpE8-hj9hTNtaAPakc6h4Ay6-MxqODSogCQ/exec" title="Nueva implementación del asistente" loading="lazy" allowfullscreen></iframe>
    </div>
  </main>

  <script src="common.js"></script>
</body>
</html>
