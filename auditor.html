<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditor Certy - Validación Inteligente</title>
    <link rel="icon" type="image/png" href="Certy_cara.png">
    <link rel="stylesheet" href="styles_antigravity_utf8.css">
    <link rel="stylesheet" href="styles_fixed.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .drag-area {
            border: 2px dashed var(--color-primary);
            height: 300px;
            width: 100%;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(12, 79, 183, 0.03);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 2rem;
        }

        .drag-area.active {
            border: 2px solid var(--color-primary);
            background: rgba(12, 79, 183, 0.08);
        }

        .drag-area .icon {
            font-size: 4rem;
            color: var(--color-primary);
            margin-bottom: 1rem;
        }

        .drag-area header {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--color-text-dark);
        }

        .drag-area span {
            font-size: 1rem;
            color: var(--color-text-light);
            margin: 0.5rem 0 1rem 0;
        }

        .result-container {
            margin-top: 2rem;
            display: none;
        }

        .audit-alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .alert-error {
            background: #fff5f5;
            border: 1px solid #feb2b2;
            color: #c53030;
        }

        .alert-success {
            background: #f0fff4;
            border: 1px solid #9ae6b4;
            color: #2f855a;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--color-primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="bg-wave">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <path fill="#0C4FB7"
                d="M44.7,-76.4C58.9,-69.2,71.8,-59.1,79.6,-46.9C87.4,-34.7,90.1,-20.4,85.8,-7.4C81.5,5.6,70.2,17.2,59.6,27.1C49,37,39.1,45.2,28.7,51.4C18.3,57.6,7.4,61.8,-3.2,67.4C-13.8,72.9,-24.1,79.9,-34.3,77.5C-44.5,75.1,-54.6,63.3,-62.3,51.3C-70,39.3,-75.3,27.1,-76.8,14.5C-78.3,1.9,-76,-11.1,-69.8,-22.3C-63.6,-33.5,-53.5,-42.9,-42.6,-51.2C-31.7,-59.5,-20,-66.7,-7.4,-67.2C5.2,-67.7,29.3,-83.6,44.7,-76.4Z"
                transform="translate(100 100)" />
        </svg>
    </div>

    <header class="app-header">
        <div class="header-left">
            <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Volver</a>
        </div>
        <div class="header-right">
            <div class="weather-widget">
                <span>Auditor Certy</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <div class="form-wrapper">
            <div class="form-container">
                <h1>Auditor de Planes de Trabajo</h1>
                <p style="text-align: center; color: var(--color-text-light); margin-bottom: 2rem;">
                    Sube el PDF de tu Plan de Trabajo para verificar la consistencia matemática y evitar rechazos.
                </p>

                <div class="drag-area" id="dragArea">
                    <div class="icon"><i class="fa-solid fa-file-pdf"></i></div>
                    <header>Arrastra y suelta tu PDF aquí</header>
                    <span>o</span>
                    <button class="btn-blue-rounded-outline">Seleccionar Archivo</button>
                    <input type="file" hidden id="fileInput" accept="application/pdf">
                </div>

                <div class="loader" id="loader"></div>

                <div class="result-container" id="resultContainer">
                    <h2 style="color: var(--color-primary); margin-bottom: 1.5rem;">Resultado de la Auditoría</h2>
                    <div id="resultsList"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const dragArea = document.getElementById("dragArea");
        const fileInput = document.getElementById("fileInput");
        const loader = document.getElementById("loader");
        const resultContainer = document.getElementById("resultContainer");
        const resultsList = document.getElementById("resultsList");
        const selectBtn = dragArea.querySelector("button");

        selectBtn.onclick = () => fileInput.click();

        fileInput.addEventListener("change", function () {
            const file = this.files[0];
            if (file) processFile(file);
        });

        dragArea.addEventListener("dragover", (event) => {
            event.preventDefault();
            dragArea.classList.add("active");
        });

        dragArea.addEventListener("dragleave", () => {
            dragArea.classList.remove("active");
        });

        dragArea.addEventListener("drop", (event) => {
            event.preventDefault();
            const file = event.dataTransfer.files[0];
            if (file) processFile(file);
        });

        function processFile(file) {
            if (file.type !== "application/pdf") {
                alert("Por favor, sube un archivo PDF.");
                return;
            }

            dragArea.style.display = "none";
            loader.style.display = "block";
            resultContainer.style.display = "none";

            // Simulación de envío al backend (Python)
            setTimeout(() => {
                loader.style.display = "none";
                resultContainer.style.display = "block";

                // Estos resultados vendrían de la ejecución de auditor_logic.py
                const mockResults = [
                    { type: 'success', text: 'Hoja 1: Todos los ítems suman 100%.' },
                    { type: 'error', text: 'Hoja 2: La suma de montos mensuales ($1.200.500) no coincide con el monto total ($1.200.000).' },
                    { type: 'success', text: 'Consistencia horizontal: Verificada correctamente mes a mes.' }
                ];

                resultsList.innerHTML = mockResults.map(res => `
                    <div class="audit-alert ${res.type === 'success' ? 'alert-success' : 'alert-error'}">
                        <i class="fa-solid ${res.type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i>
                        <span>${res.text}</span>
                    </div>
                `).join('');
            }, 3000);
        }
    </script>
</body>

</html>
