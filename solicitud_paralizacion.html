<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solicitud de Paralización</title>
  <link rel="icon" type="image/png" href="Certy_cara.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .btn-certy{padding:0.8rem 2rem!important;border-radius:12px!important;border:none!important;background:#0C4FB7!important;color:#fff!important;font-weight:700!important;font-size:1rem!important;text-transform:uppercase!important;cursor:pointer!important;transition:all .3s cubic-bezier(.4,0,.2,1)!important;box-shadow:0 10px 40px -10px rgba(0,0,0,.1)!important;display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:10px!important}
    .btn-certy:hover{background:#08327d!important;box-shadow:0 8px 25px rgba(12,79,183,.3)!important;transform:translateY(-2px)!important}
    .btn-delete:hover{background:#f58b2a!important;box-shadow:0 8px 25px rgba(245,139,42,.3)!important}
    .btn-print{background:#2a7ff5!important;margin:2rem auto!important}
    .certy-modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:10000;animation:fadeIn .3s ease}
    .certy-modal{background:#fff;padding:2.5rem;border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.2);max-width:450px;width:90%;text-align:center;animation:scaleIn .3s cubic-bezier(.34,1.56,.64,1)}
    .certy-modal img{height:80px;margin-bottom:1.5rem}
    .certy-modal p{font-size:1.1rem;color:#1a202c;margin-bottom:2rem;line-height:1.5;font-weight:600}
    .certy-modal-btn{padding:.8rem 2.5rem;background:#0C4FB7;color:#fff;border:none;border-radius:12px;font-weight:700;cursor:pointer;text-transform:uppercase;transition:all .2s}
    .certy-modal-btn:hover{background:#08327d}
    .certy-img-small{width:40%!important;height:auto!important;margin:1rem auto!important;display:block!important}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes scaleIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  </style>
</head>

<body>
  <header class="site-header">
    <button class="back-btn" onclick="window.location.href='index.html'" aria-label="Volver al menú principal"><i
        class="fa-solid fa-arrow-left"></i></button>
    <div class="logo-group">
      <img src="NeuquénCapital_logo.png" alt="Logo Neuquén Capital">
    </div>
    <div class="header-actions">
      <img src="Certy_logo.png" alt="Avatar de Certy" class="certy-avatar">
    </div>
  </header>

  <div class="form-wrapper">
    <div class="calc-mascot">
      <img src="Certy_celular.png" alt="Certy">
      <div class="speech">Completá la solicitud</div>
    </div>
    <div class="container form-container">
      <h1>Solicitud de Paralización</h1>
      <form id="paralizacionForm">
        <label for="fechaSolicitud">Fecha de solicitud</label>
        <input type="date" id="fechaSolicitud" required />

        <label for="numeroExpediente">N° de Expediente</label>
        <input type="text" id="numeroExpediente" required />

        <label for="inspectores">Inspectores a cargo</label>
        <input type="text" id="inspectores" required />

        <label for="tipoAlteracion">Tipo de alteración que se solicita</label>
        <select id="tipoAlteracion">
          <option value="Paralización" selected>Paralización</option>
        </select>

        <label for="nombreObra">Nombre de la Obra</label>
        <input type="text" id="nombreObra" required />

        <label for="empresaContratista">Empresa contratista</label>
        <input type="text" id="empresaContratista" required />

        <label for="adjudicadaPor">Adjudicada por</label>
        <input type="text" id="adjudicadaPor" required />

        <label for="motivo">Motivo de la solicitud</label>
        <textarea id="motivo" rows="4" required></textarea>

        <button type="submit" class="btn-certy btn-calculate"><i class="fa-solid fa-paper-plane"></i> SOLICITAR</button>
      </form>
    </div>
  </div>

  <script src="common.js"></script>
  <script>
    document.getElementById('paralizacionForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const datos = {
        fechaSolicitud: document.getElementById('fechaSolicitud').value,
        numeroExpediente: document.getElementById('numeroExpediente').value.trim(),
        inspectores: document.getElementById('inspectores').value.trim(),
        tipoAlteracion: document.getElementById('tipoAlteracion').value,
        nombreObra: document.getElementById('nombreObra').value.trim(),
        empresaContratista: document.getElementById('empresaContratista').value.trim(),
        adjudicadaPor: document.getElementById('adjudicadaPor').value.trim(),
        motivo: document.getElementById('motivo').value.trim()
      };
      try {
        const response = await fetch('https://script.google.com/macros/s/AKfycbw_JGQv7eFo6JTbsfaWipcKk53DB8E4OjiCnyPxBE52t-lv5CKu4KzJnzlJx1wPNfMd/exec', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        const result = await response.json();
        if (result.success) {
          alert('Solicitud enviada correctamente.');
          this.reset();
        } else {
          const msg = result.error || 'Error al enviar la solicitud.';
          alert('Error: ' + msg);
        }
      } catch (error) {
        alert('Error al enviar la solicitud.');
      }
    });
  </script>
</body>

</html>
