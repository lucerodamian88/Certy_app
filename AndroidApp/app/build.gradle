plugins {
    id 'com.android.application' version '8.0.2'
}

android {
    namespace "com.example.certyapp"
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.example.certyapp"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.github.barteksc:android-pdf-viewer:3.2.0-beta.1'
}
