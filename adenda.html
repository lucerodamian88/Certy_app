<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generación de Adenda</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.1.0/docx.min.js"></script>
</head>
<body>
  <div class="logo-container">
    <img src="logo.png" alt="Logo Neuquén Capital" class="logo" />
  </div>
  <div class="container">
    <button class="backBtn" onclick="window.location.href='index.html'">Volver al menú</button>
    <h1>Generación de Adenda</h1>
    <form id="adendaForm">
      <label>Nombre de la obra
        <input type="text" id="obra" required>
      </label>
      <label>Nombre de la empresa
        <input type="text" id="empresa" required>
      </label>
      <label>CUIT de la empresa
        <input type="text" id="cuit" required>
      </label>
      <label>Cargo del representante
        <input type="text" id="cargoRep" required>
      </label>
      <label>Nombre del representante
        <input type="text" id="nombreRep" required>
      </label>
      <label>DNI del representante
        <input type="text" id="dniRep" required>
      </label>
      <label>Fecha de firma del contrato
        <input type="date" id="fechaContrato" required>
      </label>
      <label>Nº de disposición que aprueba la adjudicación
        <input type="text" id="dispoAdjudicacion" required>
      </label>
      <label>Nº de contratación directa
        <input type="text" id="contratacion" required>
      </label>
      <label>Monto del contrato en letras
        <input type="text" id="montoLetras" required>
      </label>
      <label>Monto del contrato en números
        <input type="text" id="montoNumeros" required>
      </label>
      <label>Plazo original de obra (en días corridos)
        <input type="number" id="plazoOriginal" required>
      </label>
      <label>Nº de disposición de la ampliación de plazo
        <input type="text" id="dispoAmpliacion" required>
      </label>
      <label>Nº de expediente y alcance
        <input type="text" id="expediente" required>
      </label>
      <label>Plazo de obra total actualizado (en días corridos)
        <input type="number" id="plazoTotal" required>
      </label>
      <label>Fecha de finalización de la obra
        <input type="date" id="fechaFinalizacion" required>
      </label>
    </form>
    <button id="generateBtn">Generar Adenda</button>
    <p id="message"></p>
  </div>
  <script src="adenda.js"></script>
</body>
</html>
